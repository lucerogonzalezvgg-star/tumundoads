<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Mobile - Google Ads</title>
<style>
  :root{
    --orange:#FF6600;
    --dark:#1a1a1a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Helvetica Neue', Arial, sans-serif;
    background:#ffffff;
  }
  .banner{
    position:relative;
    width:100%;
    max-width:420px;
    margin:0 auto;
    background:#ffffff;
    padding:32px 28px 28px;
    overflow:visible;
    text-align:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff2e8;
    border-radius:999px;
    padding:6px 14px 6px 8px;
    margin-bottom:16px;
  }
  .badge-icon{
    width:22px;height:22px;
    background:#fff;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .badge-icon img{ width:16px;height:16px; }
  .badge-text{
    font-size:12.5px;
    font-weight:700;
    color:var(--orange);
    letter-spacing:0.2px;
  }

  h1{
    font-size:26px;
    line-height:1.18;
    font-weight:800;
    color:var(--dark);
    letter-spacing:-0.3px;
  }
  h1 .accent{ color:var(--orange); }
  .subtitle{
    font-size:15px;
    font-weight:500;
    color:#8a8a8a;
    margin-top:6px;
  }

  /* ---------- DEVICE ---------- */
  .devices{
    position:relative;
    width:100%;
    max-width:230px;
    margin:34px auto 0;
    aspect-ratio: 230 / 342;
  }

  .device{ position:absolute; filter:drop-shadow(0 12px 18px rgba(0,0,0,0.18)); }
  .device img.frame{ position:relative; display:block; width:100%; z-index:2; }
  .scroll-clip{ position:absolute; overflow:hidden; background:#fff; }
  .scroll-track{
    position:absolute; top:0; left:0; width:100%;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }
  .scroll-track img{ display:block; width:100%; height:auto; }

  @keyframes scrollY{
    0%{ transform:translateY(0); }
    8%{ transform:translateY(0); }
    45%{ transform:translateY(var(--shift)); }
    55%{ transform:translateY(var(--shift)); }
    92%{ transform:translateY(0); }
    100%{ transform:translateY(0); }
  }

  .tablet{ left:0; top:0; width:230px; z-index:3; }
  .tablet .scroll-clip{ left:6px; top:7px; width:218px; height:307px; }
  .tablet .scroll-track{ animation-name:scrollY; animation-duration:17s; --shift:-152px; }

  .float-badge{
    position:absolute;
    width:54px; height:54px;
    left:-16px; top:-20px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,0.16);
    display:flex; align-items:center; justify-content:center;
    z-index:4;
  }
  .float-badge img{ width:32px; height:32px; }

  /* ---------- MOCK SEARCH CONTENT ---------- */
  .mock{ width:218px; font-family:Arial, Helvetica, sans-serif; padding:13px 11px; }

  .searchbar{
    display:flex; align-items:center; gap:7px;
    border:1px solid #e2e2e2; border-radius:999px;
    padding:8px 11px; box-shadow:0 1px 4px rgba(0,0,0,0.06);
    margin-bottom:15px;
  }
  .searchbar svg{ width:13px;height:13px; flex-shrink:0; }
  .searchbar span{ font-size:10.5px; color:#8a8a8a; }

  .sponsored-tag{ font-size:8.5px; color:#5f6368; margin-bottom:4px; font-weight:600;}
  .ad-card{ margin-bottom:16px; }
  .ad-head{ display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .ad-icon{
    width:18px;height:18px;border-radius:5px; background:var(--orange);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .ad-icon svg{ width:10px;height:10px; fill:#fff; }
  .ad-brand{ font-size:10px; font-weight:700; color:#202124; }
  .ad-url{ font-size:8px; color:#5f6368; margin-bottom:4px; margin-left:24px; }
  .ad-title{ font-size:11.5px; color:#1a0dab; font-weight:600; line-height:1.35; margin-bottom:3px; }
  .ad-desc{ font-size:9.5px; color:#4d5156; line-height:1.45; margin-bottom:7px; }
  .ad-btn{
    display:inline-block; font-size:8.5px; font-weight:600; color:var(--orange);
    border:1px solid var(--orange); border-radius:999px; padding:3px 10px;
  }

  .divider{ height:1px; background:#ececec; margin:13px 0; }

  .organic{ margin-bottom:14px; }
  .organic .url{ font-size:8px; color:#5f6368; margin-bottom:3px; }
  .organic .title{ font-size:11px; color:#1a0dab; font-weight:600; margin-bottom:3px; }
  .bar{ height:6px; background:#eeeeee; border-radius:4px; margin-bottom:4px; }
  .bar.w80{ width:80%; } .bar.w95{ width:95%; } .bar.w60{ width:60%; } .bar.w70{width:70%;}
</style>
</head>
