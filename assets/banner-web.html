<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Banner Creación de Páginas Web</title>
<style>
  :root{
    --orange:#FF6600;
    --dark:#1a1a1a;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1400px;height:400px;}
  body{
    font-family:'Helvetica Neue', Arial, sans-serif;
    background:var(--bg);
  }
  .banner{
    position:relative;
    width:1400px;
    height:400px;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 50px;
    overflow:hidden;
  }
  .banner::after{ display:none; }

  .text-col{ flex:0 0 430px; position:relative; z-index:2; }
  .badge{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .badge-icon{
    width:38px;height:38px; background:var(--orange); border-radius:10px;
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .badge-icon svg{width:19px;height:19px;fill:#fff;}
  .badge-text{ font-size:16px; font-weight:700; color:var(--dark); }
  .badge-text span{ color:var(--orange); }
  h1{
    font-size:32px; line-height:1.14; font-weight:800; color:var(--dark);
    margin-bottom:20px; letter-spacing:-0.5px;
  }
  h1 .accent{ color:var(--orange); }
  .features{ display:flex; gap:16px; flex-wrap:wrap; }
  .feature{
    display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600;
    color:var(--dark); white-space:nowrap;
  }
  .feature svg{width:16px;height:16px;stroke:var(--orange);fill:none;stroke-width:2;flex-shrink:0;}
  .feature + .feature{ padding-left:16px; border-left:1px solid #d8d8d8; }

  .devices{ position:relative; flex:1 1 auto; height:400px; z-index:2; }

  .device{ position:absolute; filter:drop-shadow(0 16px 20px rgba(0,0,0,0.25)); }
  .device img.frame{ position:relative; display:block; width:100%; z-index:2; }
  .scroll-clip{ position:absolute; overflow:hidden; }
  .scroll-track{
    position:absolute; top:0; left:0; width:100%;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }
  .scroll-track img{ display:block; width:100%; height:auto; }

  @keyframes scrollY{
    0%{ transform:translateY(0); }
    8%{ transform:translateY(0); }
    45%{ transform:translateY(var(--shift)); }
    55%{ transform:translateY(var(--shift)); }
    92%{ transform:translateY(0); }
    100%{ transform:translateY(0); }
  }

  .monitor{ left:120px; top:10px; width:400px; z-index:2; }
  .monitor .scroll-clip{ left:12px; top:12px; width:376px; height:199px; }
  .monitor .scroll-track{ animation-name:scrollY; animation-duration:19s; --shift:-596px; }

  .phone{ left:20px; top:148px; width:112px; z-index:3; }
  .phone .scroll-clip{
    left:0; top:0; width:96px; height:194px;
    transform:matrix3d(0.788330,0.136875,0,0.000991, 0.140436,0.960884,0,-0.000040, 0,0,1,0, 11.6692,5.1729,0,1.0);
    transform-origin:0 0;
  }
  .phone .scroll-track{ animation-name:scrollY; animation-duration:14s; --shift:-9px; }

  .tablet{ left:592px; top:60px; width:150px; z-index:3; }
  .tablet .scroll-clip{ left:4px; top:4px; width:142px; height:201px; border-radius:3px; }
  .tablet .scroll-track{ animation-name:scrollY; animation-duration:16s; --shift:-119px; }
</style>
</head>
