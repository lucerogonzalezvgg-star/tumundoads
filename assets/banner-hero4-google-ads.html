<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Banner Hero 4 - Google Ads (Monitor + Celular)</title>
<style>
  :root{
    --orange:#FF6600;
    --dark:#1a1a1a;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1400px;height:400px;}
  body{ font-family:'Helvetica Neue', Arial, sans-serif; background:var(--bg); }

  .banner{
    position:relative;
    width:1400px; height:400px;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 60px;
    overflow:hidden;
  }

  /* ---------- LEFT TEXT ---------- */
  .text-col{ flex:0 0 470px; position:relative; z-index:2; }

  .badge{
    display:flex; align-items:center; gap:12px;
    margin-bottom:20px;
  }
  .badge img{ width:34px; height:34px; }
  .badge-text{ font-size:22px; font-weight:700; color:var(--dark); }

  h1{
    font-size:52px;
    line-height:1.05;
    font-weight:800;
    color:var(--dark);
    letter-spacing:-1px;
  }
  h1 .accent{ color:var(--orange); }

  .subtitle{
    font-size:24px;
    font-weight:500;
    color:#6f6f6f;
    margin-top:8px;
    margin-bottom:28px;
  }

  .features{ display:flex; align-items:flex-start; }
  .feature{
    display:flex; flex-direction:column; gap:8px;
    padding:0 18px;
  }
  .feature:first-child{ padding-left:0; }
  .feature + .feature{ border-left:1px solid #e5e5e5; }
  .feature svg{ width:24px; height:24px; stroke:var(--orange); fill:none; stroke-width:1.8; }
  .feature span{ font-size:13.5px; font-weight:600; color:var(--dark); line-height:1.3; }

  /* ---------- DEVICES ---------- */
  .devices{ position:relative; flex:1 1 auto; height:400px; z-index:2; }

  .device{ position:absolute; filter:drop-shadow(0 18px 26px rgba(0,0,0,0.18)); }
  .device img.frame{ position:relative; display:block; width:100%; z-index:2; }
  .scroll-clip{ position:absolute; overflow:hidden; background:#fff; }
  .scroll-track{
    position:absolute; top:0; left:0; width:100%;
    animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }
  .scroll-track img{ display:block; width:100%; height:auto; }

  @keyframes scrollY{
    0%{ transform:translateY(0); }
    8%{ transform:translateY(0); }
    45%{ transform:translateY(var(--shift)); }
    55%{ transform:translateY(var(--shift)); }
    92%{ transform:translateY(0); }
    100%{ transform:translateY(0); }
  }

  .monitor{ left:150px; top:10px; width:420px; z-index:2; }
  .monitor .scroll-clip{ left:13px; top:13px; width:394px; height:209px; }
  .monitor .scroll-track{ animation-name:scrollY; animation-duration:19s; --shift:-617px; }

  .phone{ left:30px; top:150px; width:112px; z-index:3; }
  .phone .scroll-clip{
    left:0; top:0; width:96px; height:194px;
    transform:matrix3d(0.788330,0.136875,0,0.000991, 0.140436,0.960884,0,-0.000040, 0,0,1,0, 11.6692,5.1729,0,1.0);
    transform-origin:0 0;
  }
  .phone .scroll-track{ animation-name:scrollY; animation-duration:14s; --shift:-9px; }
</style>
</head>
